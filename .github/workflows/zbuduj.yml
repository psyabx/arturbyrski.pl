name: Zbuduj stronę

# Po każdej zmianie danych gier (ręcznej albo z wydania gry) generuje strony gier,
# sekcję gier na stronie głównej oraz feedy: api/gry.json, api/wydania.json, feed.xml.

on:
  push:
    branches: [main]
    paths:
      - "dane/**"
      - "narzedzia/**"
      - "index.html"
      - ".github/workflows/zbuduj.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zbuduj-strone-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zbuduj:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Wygeneruj stronę
        run: python3 narzedzia/strona.py zbuduj

      - name: Sprawdź, czy wygenerowane pliki są aktualne (pull request)
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Uruchom lokalnie: python3 narzedzia/strona.py zbuduj i dodaj zmienione pliki."
            exit 1
          fi

      - name: Zapisz zmiany (main)
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Bez zmian."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Strona: przebudowa z danych gier"
          git push
